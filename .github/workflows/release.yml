name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Runs go one at a time so job deploys do not interleave. A pending run is
# replaced by a newer one (only one pending run per group).
concurrency:
  group: release
  cancel-in-progress: false

env:
  PROJECT_ID: jiikko
  REGISTRY_HOST: asia-northeast1-docker.pkg.dev
  REPOSITORY_NAME: prpr-antena

jobs:
  create_deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: chrnorm/deployment-action@v2
        name: Create GitHub deployment
        id: deployment
        with:
          token: '${{ github.token }}'
          environment-url: https://prpr-antena.com/
          environment: production
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}

  test_go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Go tests
        working-directory: src
        shell: bash
        run: |
          go vet ./...
          go test -count=1 -v ./... | tee "$RUNNER_TEMP/go-test.log"
          test "${PIPESTATUS[0]}" -eq 0
          # Tests that need local-only fixtures skip in CI; list them so a skip is not read as a pass.
          grep -- '--- SKIP' "$RUNNER_TEMP/go-test.log" || true

  build_go:
    needs: test_go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: "auth"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"
      - name: Authorize Docker push
        run: gcloud auth configure-docker "${REGISTRY_HOST}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push the Go batch image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: go
          tags: ${{ env.REGISTRY_HOST }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/batch-go:master-${{ github.sha }} , ${{ env.REGISTRY_HOST }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/batch-go:master

  # The batch that writes https://prpr-antena.com/ (src/, the Go
  # implementation), the only thing this workflow deploys. It writes the public
  # page keys: an empty ANTENA_PREFIX, which the batch accepts only with
  # ANTENA_ALLOW_PUBLIC=true.
  deploy_batch:
    needs: build_go
    runs-on: ubuntu-latest
    env:
      JOB_NAME: antena-fetch-posts-next
      SCHEDULER_NAME: antena-fetch-posts-next-scheduler-trigger
      JOB_REGION: asia-northeast1
      PREFIX: ""
      ALLOW_PUBLIC: "true"
    steps:
      - id: "auth"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"
      - name: Verify migration state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # state/posts.json holds full feed bodies in the public page bucket. The
          # bucket policy denies the CloudFront OAI on state/* and locks/*; make
          # sure the site really refuses state/ before the job writes there.
          # Probe an object that is known to exist: a missing key is 403 even
          # without the Deny (the OAI has no ListBucket), which would prove nothing.
          echo "Deny probe for the HideState bucket policy" |
            aws s3 cp - s3://prpr-antena/state/deny-probe.txt --region ap-northeast-1 --content-type text/plain
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://prpr-antena.com/state/deny-probe.txt?v=${GITHUB_SHA}")
          if [[ "$code" != "403" ]]; then
            echo "::error::https://prpr-antena.com/state/deny-probe.txt returned $code (expected 403); restore the HideState Deny in the prpr-antena bucket policy."
            exit 1
          fi

      - name: Deploy the batch job
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # --set-env-vars replaces the whole job environment.
          # --task-timeout must stay below the lock's stale age (1h, store.DefaultStaleAfter)
          # so a running task is killed before another execution may take its lock over.
          # --args="" clears arguments left by an earlier command (the Ruby job had some).
          gcloud run jobs deploy "$JOB_NAME" \
            --project="$PROJECT_ID" \
            --region="$JOB_REGION" \
            --image="${REGISTRY_HOST}/$PROJECT_ID/$REPOSITORY_NAME/batch-go:master-${GITHUB_SHA}" \
            --command="/app/antena-batch" \
            --args="" \
            --task-timeout=1800s \
            --max-retries=0 \
            --set-env-vars="AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID},AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY},ANTENA_PREFIX=${PREFIX},ANTENA_ALLOW_PUBLIC=${ALLOW_PUBLIC}"

          # Read the prefix back: a dropped empty value would make the batch refuse to run (ANTENA_PREFIX is required).
          # Read the command back too: leftover arguments would be passed to the Go binary.
          actual=$(gcloud run jobs describe "$JOB_NAME" --project="$PROJECT_ID" --region="$JOB_REGION" --format=json |
            python3 -c 'import json, sys; c=json.load(sys.stdin)["spec"]["template"]["spec"]["template"]["spec"]["containers"][0]; env=c.get("env", []); print(json.dumps([c.get("command", []), c.get("args", []), next((e.get("value", "") for e in env if e["name"] == "ANTENA_PREFIX"), "<unset>")]))')
          expected=$(python3 -c 'import json, sys; print(json.dumps([["/app/antena-batch"], [], sys.argv[1]]))' "$PREFIX")
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::$JOB_NAME has [command, args, ANTENA_PREFIX]=$actual, expected $expected."
            exit 1
          fi

      - name: Update the batch schedule
        run: |
          # The trigger is created once by hand (docs/flow.md); this fails if it is missing.
          gcloud scheduler jobs update http "$SCHEDULER_NAME" \
            --schedule "*/30 8-23 * * *" \
            --time-zone "Asia/Tokyo" \
            --location "$JOB_REGION"
          # Never resume it here: it is paused on purpose during state resets and
          # emergencies, and a push must not undo that.
          state=$(gcloud scheduler jobs describe "$SCHEDULER_NAME" --location "$JOB_REGION" --format='value(state)')
          if [[ "$state" == "PAUSED" ]]; then
            echo "::warning::$SCHEDULER_NAME is paused; resume it by hand when the reset or emergency is over (docs/flow.md)."
          fi

  update_deployment_status:
    needs: [create_deployment, build_go, deploy_batch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Update deployment status (failure)
        if: "needs.create_deployment.result == 'success' && needs.deploy_batch.result != 'success'"
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          environment-url: https://prpr-antena.com/
          state: 'failure'
          deployment-id: ${{ needs.create_deployment.outputs.deployment_id }}
      - name: Update deployment status (success)
        if: "needs.create_deployment.result == 'success' && needs.build_go.result == 'success' && needs.deploy_batch.result == 'success'"
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          environment-url: https://prpr-antena.com/
          state: 'success'
          deployment-id: ${{ needs.create_deployment.outputs.deployment_id }}
